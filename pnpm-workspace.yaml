packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": ^22.20.5
  eslint: ^9.39.5
  typescript: 5.9.3
  vitest: ^5.1.0
  yjs: 13.6.33

allowBuilds:
  # Install scripts are off unless a package is shown to need one. esbuild and
  # workerd (both pulled in by wrangler) run from their platform packages
  # without theirs.
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false

minimumReleaseAgeExclude:
  - prettier@3.10.1
